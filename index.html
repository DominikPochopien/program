<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frekwencja na zajęciach</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <!-- Ekran logowania / rejestracji -->
  <section id="auth" class="auth card" hidden>
    <h1>Frekwencja</h1>
    <form id="auth-form">
      <label class="field">E-mail<input type="email" id="auth-email" required autocomplete="email"></label>
      <label class="field">Hasło<input type="password" id="auth-password" required minlength="6" autocomplete="current-password"></label>
      
      <div id="auth-requirements" class="password-reqs" hidden>
        <div class="req-title">Hasło powinno zawierać minimum:</div>
        <ul class="req-list">
          <li id="req-length" class="req-item req-item--invalid">✓ 8 znaków</li>
          <li id="req-lower" class="req-item req-item--invalid">✓ 1 małą literę</li>
          <li id="req-upper" class="req-item req-item--invalid">✓ 1 dużą literę</li>
          <li id="req-number" class="req-item req-item--invalid">✓ 1 cyfrę lub znak specjalny</li>
        </ul>
      </div>

      <p id="auth-message" class="auth__message"></p>
      
      <div id="auth-buttons" class="row">
        <button type="submit" class="btn btn--primary" id="btn-login">Zaloguj</button>
        <button type="button" id="btn-show-signup" class="btn">Załóż konto</button>
      </div>
      <button type="button" id="auth-signup" class="btn btn--warn btn--block" hidden disabled>Załóż konto</button>
    </form>
  </section>

  <!-- Główna aplikacja -->
  <main id="app" class="app" hidden>
    <section class="card calendar-section">
      <div class="toolbar">
        <button id="prev-month" class="btn" aria-label="Poprzedni miesiąc">‹</button>
        <h2 id="month-title" class="toolbar__title"></h2>
        <button id="today" class="btn">Dziś</button>
        <button id="next-month" class="btn" aria-label="Następny miesiąc">›</button>
        
        <!-- Przycisk ustawień (zębatka z SVG, ze standardowym obramowaniem) -->
        <button id="btn-settings" class="btn" aria-label="Ustawienia" style="padding: 6px 10px; display: flex; align-items: center; justify-content: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        
        <!-- Przycisk wylogowania -->
        <button id="sign-out" class="btn" style="padding: 6px 12px; font-size: 14px;">Wyloguj się</button>
      </div>
      
      <!-- Kontener kalendarza -->
      <div id="calendar" class="calendar"></div>
    </section>

    <!-- Panel boczny z przedmiotami -->
    <aside class="card">
      <h3>Przedmioty</h3>
      <div id="subjects"></div>
      <button id="add-subject" class="btn btn--primary btn--block">+ Dodaj przedmiot</button>
    </aside>
  </main>

  <!-- Okienka dialogowe (szare tło) -->
  <div id="overlay" class="overlay">
    
    <!-- Główne okienko (np. dodawanie przedmiotu, status zajęć) -->
    <div id="modal" class="modal"></div>
    
    <!-- Okienko ustawień (zębatka) -->
    <div id="settings-modal" class="modal" hidden>
      <h3 style="margin-bottom: 4px;">Ustawienia</h3>
      <p style="font-size: 12px; font-weight: 600; margin: 0 0 4px;">Wyświetlanie kalendarza</p>
      <p style="font-size: 11px; color: var(--muted); margin: 0 0 16px;">Zaznacz dni tygodnia, które mają być widoczne:</p>
      
      <!-- Siatka dwukolumnowa na dni -->
      <div id="settings-days" class="settings-grid">
        <label class="checkbox-row">Poniedziałek <input type="checkbox" value="1"></label>
        <label class="checkbox-row">Piątek <input type="checkbox" value="5"></label>
        <label class="checkbox-row">Wtorek <input type="checkbox" value="2"></label>
        <label class="checkbox-row">Sobota <input type="checkbox" value="6"></label>
        <label class="checkbox-row">Środa <input type="checkbox" value="3"></label>
        <label class="checkbox-row">Niedziela <input type="checkbox" value="0"></label>
        <label class="checkbox-row">Czwartek <input type="checkbox" value="4"></label>
      </div>

      <!-- Przełącznik "zastosuj we wszystkich miesiącach" -->
      <label style="display: block; margin-top: 16px; padding: 12px; border: 2px solid #0ea5e9; border-radius: 8px; text-align: center; cursor: pointer; color: #0ea5e9; font-weight: 500; font-size: 12px; transition: background 0.2s;">
        <input type="checkbox" id="apply-to-all-months" checked style="display: none;">
        Czy zastosować to ustawienie we wszystkich miesiącach? <span id="apply-indicator" style="font-weight: bold;">(Tak ✓)</span>
      </label>

      <div style="margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px;">
        <button id="btn-save-settings" class="btn btn--primary btn--block">Zapisz</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
